name: Report a problem
description: Tell us about something in Progress Evolved that is not working
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        ## Progress Evolved · Problem report

        *Private progress, thoughtfully tracked.*

        Thanks for helping improve Progress Evolved.

        **This report is public.** Do not include progress photos, health or body data, backup files, passwords, recovery keys, or other private information. Email progressevolvedapp@gmail.com instead if your report is sensitive.

        Prefer not to use GitHub? [Use our account-free feedback form](https://tally.so/r/GxV8aQ).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what went wrong in your own words. Do not include private app data.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Progress Evolved version (Optional)
      description: Find this under Settings → About & legal. Leave blank if you are not sure.
      placeholder: "For example: 0.1.0"
  - type: input
    id: android-version
    attributes:
      label: Android version and device (Optional)
      description: Leave blank if you are not sure.
      placeholder: "For example: Android 15, Samsung Galaxy S24"
  - type: textarea
    id: steps
    attributes:
      label: What were you doing before it happened? (Optional)
      placeholder: |
        1. Open…
        2. Tap…
        3. See…
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? (Optional)
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (Optional)
      description: Only attach a screenshot after checking that it contains no personal information.
